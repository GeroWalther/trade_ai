<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="360" fill="#1F2937"/>
  
  <!-- Grid Pattern -->
  <path d="M0 40 H640 M0 80 H640 M0 120 H640 M0 160 H640 M0 200 H640 M0 240 H640 M0 280 H640 M0 320 H640" 
        stroke="#374151" stroke-width="0.5" stroke-opacity="0.5"/>
  <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360" 
        stroke="#374151" stroke-width="0.5" stroke-opacity="0.5"/>
  
  <!-- Chart Icon -->
  <path d="M270 140 L320 90 L370 140 L420 110" 
        stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="140" r="4" fill="#60A5FA"/>
  <circle cx="320" cy="90" r="4" fill="#60A5FA"/>
  <circle cx="370" cy="140" r="4" fill="#60A5FA"/>
  <circle cx="420" cy="110" r="4" fill="#60A5FA"/>
  
  <!-- News Icon -->
  <rect x="260" y="170" width="120" height="80" rx="4" fill="#4B5563"/>
  <rect x="270" y="180" width="60" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="270" y="190" width="100" height="3" rx="1.5" fill="#6B7280"/>
  <rect x="270" y="200" width="90" height="3" rx="1.5" fill="#6B7280"/>
  <rect x="270" y="210" width="95" height="3" rx="1.5" fill="#6B7280"/>
  
  <!-- Text -->
  <text x="320" y="280" text-anchor="middle" fill="#E5E7EB" font-family="system-ui, -apple-system" font-size="24" font-weight="600">
    Market News
  </text>
  <text x="320" y="300" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system" font-size="14">
    Loading market updates...
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="160" cy="180" r="40" fill="#374151" fill-opacity="0.3"/>
  <circle cx="480" cy="180" r="40" fill="#374151" fill-opacity="0.3"/>
  
  <!-- Candlestick Pattern -->
  <rect x="150" y="160" width="4" height="40" fill="#34D399"/>
  <rect x="150" y="170" width="4" height="20" fill="#34D399" fill-opacity="0.3"/>
  <rect x="160" y="150" width="4" height="60" fill="#F87171"/>
  <rect x="160" y="160" width="4" height="40" fill="#F87171" fill-opacity="0.3"/>
  <rect x="170" y="165" width="4" height="30" fill="#34D399"/>
  <rect x="170" y="175" width="4" height="10" fill="#34D399" fill-opacity="0.3"/>
  
  <!-- Mirror Pattern on Right -->
  <rect x="486" y="160" width="4" height="40" fill="#34D399"/>
  <rect x="486" y="170" width="4" height="20" fill="#34D399" fill-opacity="0.3"/>
  <rect x="476" y="150" width="4" height="60" fill="#F87171"/>
  <rect x="476" y="160" width="4" height="40" fill="#F87171" fill-opacity="0.3"/>
  <rect x="466" y="165" width="4" height="30" fill="#34D399"/>
  <rect x="466" y="175" width="4" height="10" fill="#34D399" fill-opacity="0.3"/>
</svg> 